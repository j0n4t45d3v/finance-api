name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
          distribution: 'temurin'
          cache: maven

      - name: Maven Verify
        run: ./mvnw verify
