name: Code Quality

on:
  pull_request:
  push: 
    branches: 
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Verify
        run: ./mvnw verify



        

